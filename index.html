<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine GPS & Reef Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px;
      border-radius: 8px;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .title-bar { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 3px; }
    .coord-val { font-size: 17px; font-weight: bold; color: #00ffcc; font-family: monospace; }
    .time-val { font-size: 13px; color: #ffffff; margin-top: 4px; border-top: 1px solid #444; padding-top: 4px; display: flex; justify-content: space-around; }
    
    .btn-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 1000;
    }
    .btn-save {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .btn-file {
      background: #1d3557;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .leaflet-top.leaflet-left { top: 125px !important; left: 10px !important; }
    
    .popup-btn {
      background: #2a9d8f;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      width: 100%;
    }
    .delete-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="title-bar">Location / Speed / Time</div>
    <div class="coord-val" id="lat-coord">8° 00.000' N</div>
    <div class="coord-val" id="lng-coord">78° 00.000' E</div>
    <div class="time-val">
      <span id="boat-speed" style="color: #00ffcc; font-weight: bold;">வேகம்: 0.0 kts</span>
      <span id="norm-time">நேரம்: 12:00:00 PM</span>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn-save" onclick="saveReefLocation()">📍 பார் சேவ்</button>
    <button class="btn-file" onclick="exportData()">💾 ஃபைல் எடு</button>
    <button class="btn-file" onclick="document.getElementById('import-file').click()">📂 ஏற்று</button>
    <input type="file" id="import-file" style="display:none" onchange="importData(event)">
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([8.8238, 78.1567], 11);

    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 17, attribution: 'Esri' }).addTo(map);
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'OSM' });
    const seaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'SeaMap' }).addTo(map);

    const baseLayers = {
      "🛰️ செயற்கைக்கோள் பார்வை": satLayer,
      "🗺️ சாதாரண வரைபடம்": osmLayer
    };

    L.control.layers(baseLayers, null, { position: 'topleft' }).addTo(map);

    let currentLat = 8.8238;
    let currentLng = 78.1567;
    let boatMarker = null;
    let tempMarker = null;
    let markersLayer = L.layerGroup().addTo(map);

    function formatCoord(coordinate, isLatitude) {
      const absolute = Math.abs(coordinate);
      const degrees = Math.floor(absolute);
      const minutes = (absolute - degrees) * 60;
      const direction = isLatitude >= 0 ? (coordinate >= 0 ? "N" : "S") : (coordinate >= 0 ? "E" : "W");
      return `${degrees}° ${minutes.toFixed(3)}' ${direction}`;
    }

    // சாதாரண நேரம் மற்றும் நேரலை வேகம் (Speed) கணக்கிடுதல்
    setInterval(() => {
      const now = new Date();
      let hours12 = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours12 >= 12 ? 'PM' : 'AM';
      hours12 = hours12 % 12;
      hours12 = hours12 ? hours12 : 12;
      const strHours12 = String(hours12).padStart(2, '0');
      
      document.getElementById('norm-time').innerText = `நேரம்: ${strHours12}:${minutes}:${seconds} ${ampm}`;
    }, 1000);

    // மேப்பில் தொடும்போது தற்காலிக மார்க்கர் மற்றும் சேமிக்கும் வசதி
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      const latStr = formatCoord(lat, true);
      const lngStr = formatCoord(lng, false);

      if (tempMarker) { map.removeLayer(tempMarker); }

      tempMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>🎯 தொட்ட இடம்</b><br><span style="font-family:monospace; color:#0055ff; font-weight:bold;">${latStr}</span><br><span style="font-family:monospace; color:#0055ff; font-weight:bold;">${lngStr}</span><br><button class="popup-btn" onclick="saveClickedSpot(${lat}, ${lng})">இதை சேமி</button>`, {autoClose: false})
        .openPopup();
    });

    window.saveClickedSpot = function(lat, lng) {
      const spotName = prompt("இந்தப் பாறை அல்லது இடத்தின் பெயர் உள்ளிடவும்:", "பார் " + new Date().toLocaleDateString());
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { id: Date.now(), name: spotName, lat: lat, lng: lng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        loadSavedReefs();
        if (tempMarker) { map.removeLayer(tempMarker); }
        alert("இந்த இடம் வெற்றிகரமாக சேமிக்கப்பட்டது!");
      }
    };

    // சேமித்த பாரை எளிதாக நீக்கும் வசதி
    window.deleteSpot = function(id) {
      if (confirm("இந்தப் பாறை குறிப்பை உறுதியாக அழிக்க விரும்புகிறீர்களா?")) {
        let savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        savedSpots = savedSpots.filter(spot => spot.id !== id);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));
        loadSavedReefs();
        map.closePopup();
        alert("வெற்றிகரமாக அழிக்கப்பட்டது!");
      }
    };

    function loadSavedReefs() {
      markersLayer.clearLayers();
      const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
      savedSpots.forEach((spot) => {
        const spotId = spot.id || spot.lat; 
        const marker = L.marker([spot.lat, spot.lng])
          .bindPopup(`<b>🐠 ${spot.name}</b><br>${formatCoord(spot.lat, true)}<br>${formatCoord(spot.lng, false)}<br><button class="delete-btn" onclick="deleteSpot(${spotId})">❌ இந்த பாரை அழி</button>`);
        markersLayer.addLayer(marker);
      });
    }

    function saveReefLocation() {
      const spotName = prompt("பார் அல்லது இடத்தின் பெயர் உள்ளிடவும்:", "மீன் பார் " + new Date().toLocaleDateString());
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { id: Date.now(), name: spotName, lat: currentLat, lng: currentLng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        loadSavedReefs();
        alert("இடம் வெற்றிகரமாக சேமிக்கப்பட்டது!");
      }
    }

    function exportData() {
      const data = localStorage.getItem('marineReefs') || '[]';
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'My_Fishing_Reefs.json';
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = e.target.result;
          JSON.parse(content);
          localStorage.setItem('marineReefs', content);
          loadSavedRerfs = loadSavedReefs();
          loadSavedReefs();
          alert("ஃபைல் வெற்றிகரமாக ஏற்றப்பட்டது!");
        } catch (err) {
          alert("தவறான ஃபைல் வடிவம்!");
        }
      };
      reader.readAsText(file);
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          
          // படகின் வேகம் (Knots கணக்கீடு: m/s லிருந்து knots-க்கு மாற்ற)
          const speedKnots = pos.coords.speed ? (pos.coords.speed * 1.94384).toFixed(1) : "0.0";

          document.getElementById('lat-coord').innerText = formatCoord(currentLat, true);
          document.getElementById('lng-coord').innerText = formatCoord(currentLng, false);
          document.getElementById('boat-speed').innerText = `வேகம்: ${speedKnots} kts`;

          if (!boatMarker) {
            boatMarker = L.circleMarker([currentLat, currentLng], {
              radius: 9,
              color: '#ff0000',
              fillColor: '#0077ff',
              fillOpacity: 1
            }).addTo(map).bindPopup("உங்கள் படகு");
          } else {
            boatMarker.setLatLng([currentLat, currentLng]);
          }
        },
        (err) => console.log(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    loadSavedReefs();
  </script>
</body>
</html>

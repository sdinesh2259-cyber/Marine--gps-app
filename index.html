<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine GPS & Reef Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px;
      border-radius: 8px;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .title-bar { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 3px; }
    .coord-val { font-size: 17px; font-weight: bold; color: #00ffcc; font-family: monospace; }
    .time-val { font-size: 12px; color: #ffffff; margin-top: 4px; border-top: 1px solid #444; padding-top: 4px; display: flex; justify-content: space-around; }
    
    .btn-save {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .leaflet-top.leaflet-left { top: 115px !important; left: 10px !important; }
    
    .popup-btn {
      background: #2a9d8f;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="title-bar">Location / Time</div>
    <div class="coord-val" id="lat-coord">8° 00.000' N</div>
    <div class="coord-val" id="lng-coord">78° 00.000' E</div>
    <div class="time-val">
      <span id="rail-time">ரயில்வே: 00:00:00</span>
      <span id="norm-time">சாதாரண: 12:00:00 AM</span>
    </div>
  </div>

  <button class="btn-save" onclick="saveReefLocation()">📍 மீன்பிடி பார் சேவ் செய்</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([8.8238, 78.1567], 11);

    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 17, attribution: 'Esri' }).addTo(map);
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'OSM' });
    const seaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'SeaMap' }).addTo(map);

    const baseLayers = {
      "🛰️ செயற்கைக்கோள் பார்வை": satLayer,
      "🗺️ சாதாரண வரைபடம்": osmLayer
    };

    L.control.layers(baseLayers, null, { position: 'topleft' }).addTo(map);

    let currentLat = 8.8238;
    let currentLng = 78.1567;
    let boatMarker = null;
    let tempMarker = null;

    function formatCoord(coordinate, isLatitude) {
      const absolute = Math.abs(coordinate);
      const degrees = Math.floor(absolute);
      const minutes = (absolute - degrees) * 60;
      const direction = isLatitude >= 0 ? (coordinate >= 0 ? "N" : "S") : (coordinate >= 0 ? "E" : "W");
      return `${degrees}° ${minutes.toFixed(3)}' ${direction}`;
    }

    setInterval(() => {
      const now = new Date();
      const hours24 = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('rail-time').innerText = `ரயில்வே: ${hours24}:${minutes}:${seconds}`;

      let hours12 = now.getHours();
      const ampm = hours12 >= 12 ? 'PM' : 'AM';
      hours12 = hours12 % 12;
      hours12 = hours12 ? hours12 : 12;
      const strHours12 = String(hours12).padStart(2, '0');
      document.getElementById('norm-time').innerText = `சாதாரண: ${strHours12}:${minutes}:${seconds} ${ampm}`;
    }, 1000);

    // மேப்பில் எங்கு தொட்டாலும் உடனே செயல்படும் பகுதி
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      
      const latStr = formatCoord(lat, true);
      const lngStr = formatCoord(lng, false);

      if (tempMarker) {
        map.removeLayer(tempMarker);
      }

      tempMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>🎯 தொட்ட இடம் (Target)</b><br><span style="font-family:monospace; color:#0055ff; font-weight:bold;">${latStr}</span><br><span style="font-family:monospace; color:#0055ff; font-weight:bold;">${lngStr}</span><br><button class="popup-btn" onclick="saveClickedSpot(${lat}, ${lng})">இதை சேமி</button>`, {autoClose: false})
        .openPopup();
    });

    window.saveClickedSpot = function(lat, lng) {
      const spotName = prompt("இந்தப் பாறை அல்லது இடத்தின் பெயர் உள்ளிடவும்:", "பார் " + new Date().toLocaleDateString());
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { name: spotName, lat: lat, lng: lng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<b>🐠 ${spotName}</b><br>${formatCoord(lat, true)}<br>${formatCoord(lng, false)}`);

        if (tempMarker) {
          map.removeLayer(tempMarker);
        }
        alert("இந்த இடம் வெற்றிகரமாக சேமிக்கப்பட்டது!");
      }
    };

    function loadSavedReefs() {
      const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
      savedSpots.forEach((spot) => {
        L.marker([spot.lat, spot.lng])
          .addTo(map)
          .bindPopup(`<b>🐠 ${spot.name}</b><br>${formatCoord(spot.lat, true)}<br>${formatCoord(spot.lng, false)}`);
      });
    }

    function saveReefLocation() {
      const spotName = prompt("பார் அல்லது இடத்தின் பெயர் உள்ளிடவும்:", "மீன் பார் " + new Date().toLocaleDateString());
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { name: spotName, lat: currentLat, lng: currentLng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        L.marker([currentLat, currentLng])
          .addTo(map)
          .bindPopup(`<b>🐠 ${newSpot.name}</b><br>${formatCoord(currentLat, true)}<br>${formatCoord(currentLng, false)}`)
          .openPopup();

        alert("இந்த இடம் வெற்றிகரமாக சேமிக்கப்பட்டது!");
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;

          document.getElementById('lat-coord').innerText = formatCoord(currentLat, true);
          document.getElementById('lng-coord').innerText = formatCoord(currentLng, false);

          if (!boatMarker) {
            boatMarker = L.circleMarker([currentLat, currentLng], {
              radius: 9,
              color: '#ff0000',
              fillColor: '#0077ff',
              fillOpacity: 1
            }).addTo(map).bindPopup("உங்கள் படகு");
          } else {
            boatMarker.setLatLng([currentLat, currentLng]);
          }
        },
        (err) => console.log(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    loadSavedReefs();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Marine GPS & Sonar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b132b; color: #fff; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    
    #top-bar {
      background: #1c2541;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3a506b;
    }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #3a506b; color: #48cae4; font-weight: bold; }

    #map { flex: 1; width: 100%; z-index: 1; }

    #sonar-panel {
      height: 120px;
      background: #000;
      border-top: 2px solid #00f0ff;
      position: relative;
    }
    #sonar-canvas { width: 100%; height: 100%; background: radial-gradient(circle, #051329 0%, #000000 100%); }
    .sonar-data {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 13px;
      color: #00f0ff;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    #info-bar {
      background: #0b132b;
      padding: 8px 12px;
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #8d99ae;
      border-top: 1px solid #1c2541;
    }
    .val { color: #48cae4; font-weight: bold; }

    #controls {
      background: #1c2541;
      padding: 8px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #3a506b;
    }
    .btn {
      flex: 1;
      background: #00b4d8;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div id="top-bar">
    <div style="font-weight: bold; font-size: 15px; color: #48cae4;">🚤 DM Marine GPS</div>
    <div id="gps-status" class="status-badge">GPS தயார்</div>
  </div>

  <div id="map"></div>

  <div id="sonar-panel">
    <div class="sonar-data">ஆழம்: <span id="depth-val">--</span> M | தரை: <span id="surface-val">தேடுகிறது...</span></div>
    <canvas id="sonar-canvas"></canvas>
  </div>

  <div id="info-bar">
    <div>வேகம்: <span id="speed" class="val">0.0 kn</span></div>
    <div>திசை: <span id="heading" class="val">0°</span></div>
    <div>Lat: <span id="lat" class="val">--</span></div>
    <div>Lng: <span id="lng" class="val">--</span></div>
  </div>

  <div id="controls">
    <button class="btn" onclick="connectBluetoothSonar()">📡 சோனார் இணை (ESP32 Bluetooth)</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, boatMarker, boatCircle;
    let currentLat = 8.8038, currentLng = 78.1460;

    map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const boatIcon = L.divIcon({
      className: 'boat-icon',
      html: '<div style="font-size:24px;">🚤</div>',
      iconSize: [30, 30], iconAnchor: [15, 15]
    });

    boatMarker = L.marker([currentLat, currentLng], { icon: boatIcon }).addTo(map);
    boatCircle = L.circle([currentLat, currentLng], { radius: 25, color: '#00f0ff' }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        const speedKnots = (pos.coords.speed ? pos.coords.speed * 1.94384 : 0).toFixed(1);
        const headingDeg = pos.coords.heading ? Math.round(pos.coords.heading) : 0;

        document.getElementById('lat').innerText = currentLat.toFixed(4);
        document.getElementById('lng').innerText = currentLng.toFixed(4);
        document.getElementById('speed').innerText = `${speedKnots} kn`;
        document.getElementById('heading').innerText = `${headingDeg}°`;

        const newPos = [currentLat, currentLng];
        boatMarker.setLatLng(newPos);
        boatCircle.setLatLng(newPos);
        map.panTo(newPos);
      }, err => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
    }

    async function connectBluetoothSonar() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ESP32' }, { namePrefix: 'Sonar' }],
          optionalServices: ['battery_service', 0xFFE0]
        });
        alert(`டிவைஸ் இணைக்கப்பட்டது: ${device.name}`);
        document.getElementById('surface-val').innerText = "பாறை / மணல்";
      } catch (err) {
        alert("ப்ளூடூத் கிடைக்கவில்லை அல்லது இணைக்கப்படவில்லை");
      }
    }

    const canvas = document.getElementById('sonar-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    function drawSonar() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const depth = (Math.sin(Date.now() / 1500) * 8 + 22).toFixed(1);
      document.getElementById('depth-val').innerText = depth;

      points.push(depth * 3);
      if (points.length > canvas.width / 5) points.shift();

      ctx.beginPath();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      for (let i = 0; i < points.length; i++) {
        const x = i * 5;
        const y = canvas.height - points[i];
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      requestAnimationFrame(drawSonar);
    }
    drawSonar();
  </script>
</body>
</html>

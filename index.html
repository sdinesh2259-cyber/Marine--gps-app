<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Marine GPS & Sonar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: #0b132b; color: #fff; }
    
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100vw;
    }

    #top-bar {
      background: #1c2541;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3a506b;
      min-height: 38px;
    }
    .status-badge { font-size: 11px; padding: 3px 6px; border-radius: 4px; background: #3a506b; }
    .danger-active { background: #e63946 !important; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }

    #map { flex: 1; width: 100%; z-index: 1; }

    #sonar-panel {
      height: 80px;
      background: #000;
      border-top: 2px solid #00f0ff;
      position: relative;
    }
    #sonar-canvas { width: 100%; height: 100%; background: #051329; }
    .sonar-data {
      position: absolute;
      top: 4px;
      left: 8px;
      font-size: 11px;
      color: #00f0ff;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    #info-bar {
      background: #0b132b;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8d99ae;
      border-top: 1px solid #1c2541;
    }
    .val { color: #48cae4; font-weight: bold; }

    #controls {
      background: #1c2541;
      padding: 6px 8px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-top: 1px solid #3a506b;
    }
    .btn {
      color: white;
      border: none;
      padding: 8px 2px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.95); }
    .btn-sonar { background: #00b4d8; color: #000; }
    .btn-fish { background: #2ec4b6; color: #000; }
    .btn-zone { background: #ffb703; color: #000; }
    .btn-sos { background: #e63946; color: #fff; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="top-bar">
      <div style="font-weight: bold; font-size: 13px; color: #48cae4;">🚤 DM Marine GPS</div>
      <div id="zone-status" class="status-badge">பாதுகாப்பான பகுதி</div>
    </div>

    <div id="map"></div>

    <div id="sonar-panel">
      <div class="sonar-data">ஆழம்: <span id="depth-val">--</span> M | தரை: <span id="surface-val">தேடுகிறது...</span></div>
      <canvas id="sonar-canvas"></canvas>
    </div>

    <div id="info-bar">
      <div>வேகம்: <span id="speed" class="val">0.0 kn</span></div>
      <div>திசை: <span id="heading" class="val">0°</span></div>
      <div>Lat: <span id="lat" class="val">--</span></div>
      <div>Lng: <span id="lng" class="val">--</span></div>
    </div>

    <div id="controls">
      <button class="btn btn-sonar" onclick="connectBluetoothSonar()">📡 சோனார்</button>
      <button class="btn btn-fish" onclick="markFishCatch()">🐟 மீன் புள்ளி</button>
      <button class="btn btn-zone" onclick="toggleDangerZone()">⚠️ எல்லை</button>
      <button class="btn btn-sos" onclick="triggerSOS()">🚨 SOS</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, boatMarker, boatCircle;
    let currentLat = 8.8038, currentLng = 78.1460;
    let dangerZonePoly = null;
    let dangerAlarmAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const boatIcon = L.divIcon({
      className: 'boat-icon',
      html: '<div style="font-size:22px;">🚤</div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    });

    boatMarker = L.marker([currentLat, currentLng], { icon: boatIcon }).addTo(map);
    boatCircle = L.circle([currentLat, currentLng], { radius: 20, color: '#00f0ff' }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        const speedKnots = (pos.coords.speed ? pos.coords.speed * 1.94384 : 0).toFixed(1);
        const headingDeg = pos.coords.heading ? Math.round(pos.coords.heading) : 0;

        document.getElementById('lat').innerText = currentLat.toFixed(4);
        document.getElementById('lng').innerText = currentLng.toFixed(4);
        document.getElementById('speed').innerText = `${speedKnots} kn`;
        document.getElementById('heading').innerText = `${headingDeg}°`;

        const newPos = [currentLat, currentLng];
        boatMarker.setLatLng(newPos);
        boatCircle.setLatLng(newPos);
        map.panTo(newPos);

        checkDangerZone(currentLat, currentLng);
      }, err => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
    }

    function markFishCatch() {
      const time = new Date().toLocaleTimeString();
      const fishIcon = L.divIcon({
        html: '<div style="font-size:20px;">🐟</div>',
        iconSize: [22, 22], iconAnchor: [11, 11]
      });
      L.marker([currentLat, currentLng], { icon: fishIcon })
        .addTo(map)
        .bindPopup(`<b>மீன் இடம்</b><br>நேரம்: ${time}<br>${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`)
        .openPopup();
    }

    function toggleDangerZone() {
      if (dangerZonePoly) {
        map.removeLayer(dangerZonePoly);
        dangerZonePoly = null;
        return;
      }
      const dangerCoords = [
        [currentLat + 0.05, currentLng - 0.05],
        [currentLat + 0.05, currentLng + 0.05],
        [currentLat + 0.10, currentLng + 0.05],
        [currentLat + 0.10, currentLng - 0.05]
      ];
      dangerZonePoly = L.polygon(dangerCoords, { color: 'red', fillColor: '#f03', fillOpacity: 0.35 }).addTo(map);
      dangerZonePoly.bindPopup("⚠️ எல்லை மண்டலம்");
    }

    function checkDangerZone(lat, lng) {
      if (dangerZonePoly) {
        const bounds = dangerZonePoly.getBounds();
        const badge = document.getElementById('zone-status');
        if (bounds.contains([lat, lng])) {
          badge.innerText = "⚠️ எல்லை மீறல்!";
          badge.classList.add('danger-active');
          dangerAlarmAudio.play().catch(()=>{});
        } else {
          badge.innerText = "பாதுகாப்பான பகுதி";
          badge.classList.remove('danger-active');
        }
      }
    }

    function triggerSOS() {
      const msg = `SOS! உதவி தேவை. இடம்: https://maps.google.com/?q=${currentLat},${currentLng}`;
      window.location.href = `whatsapp://send?text=${encodeURIComponent(msg)}`;
    }

    async function connectBluetoothSonar() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ESP32' }, { namePrefix: 'Sonar' }],
          optionalServices: ['battery_service', 0xFFE0]
        });
        alert(`இணைக்கப்பட்டது: ${device.name}`);
        document.getElementById('surface-val').innerText = "பாறை / மணல்";
      } catch (err) {
        alert("ப்ளூடூத் கிடைக்கவில்லை");
      }
    }

    const canvas = document.getElementById('sonar-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    function drawSonar() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const depth = (Math.sin(Date.now() / 1500) * 8 + 22).toFixed(1);
      document.getElementById('depth-val').innerText = depth;

      points.push(depth * 2);
      if (points.length > canvas.width / 5) points.shift();

      ctx.beginPath();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      for (let i = 0; i < points.length; i++) {
        const x = i * 5;
        const y = canvas.height - points[i];
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      requestAnimationFrame(drawSonar);
    }
    drawSonar();
  </script>
</body>
</html>

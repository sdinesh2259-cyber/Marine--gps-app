<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine GPS & Natural Reef Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 1000;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .val { font-size: 16px; font-weight: bold; color: #00ffcc; }
    .label { font-size: 11px; color: #ccc; }
    .btn-save {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div>
      <div class="label">வேகம் (SOG)</div>
      <div class="val" id="speed">0.0 kts</div>
    </div>
    <div>
      <div class="label">திசை (Heading)</div>
      <div class="val" id="heading">0°</div>
    </div>
    <div>
      <div class="label">தற்போதைய இடம்</div>
      <div class="val" id="coords" style="font-size: 11px; color: #fff;">0.0000, 0.0000</div>
    </div>
  </div>

  <button class="btn-save" onclick="saveReefLocation()">📍 சொந்த பார் சேவ் செய்</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // தூத்துக்குடி மற்றும் மன்னார் வளைகுடா கடல் பகுதி மையமாக அமைக்கப்பட்டுள்ளது
    const map = L.map('map').setView([8.8238, 78.1567], 10);

    // 1. சாட்டிலைட் மேப் (கடலின் நிற மாறுபாடு மற்றும் ஆழமற்ற பாறைகளை தெளிவாகக் காட்டும்)
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 17,
      attribution: 'Esri Satellite'
    }).addTo(map);

    // 2. கடல் அடையாளங்கள் & கலங்கரை விளக்கம் (OpenSeaMap)
    const seaMarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    // 3. தூத்துக்குடி - மன்னார் வளைகுடா முக்கிய இயற்கை பார்கள் (Gulf of Mannar Reefs)
    const naturalReefs = [
      { name: "வான் தீவு பார் (Vaan Island Reef)", lat: 8.8350, lng: 78.2120 },
      { name: "காசுவார் பார் (Kasuwar Reef)", lat: 8.8680, lng: 78.2310 },
      { name: "காரைச்சல்லி பார் (Karaichalli Reef)", lat: 8.9520, lng: 78.2580 },
      { name: "விலங்குசல்லி ஆழ்கடல் பார் (Vilanguchalli Deep Reef)", lat: 8.9310, lng: 78.2950 },
      { name: "பாம்பன் பாறை எல்லை (Pamban Channel Reefs)", lat: 9.2780, lng: 79.2150 }
    ];

    // இயற்கை பார்களை மஞ்சள் நிற மார்க்கர்களாக திரையில் காட்டுதல்
    naturalReefs.forEach(reef => {
      L.circleMarker([reef.lat, reef.lng], {
        radius: 8,
        color: '#ffaa00',
        fillColor: '#ffff00',
        fillOpacity: 0.8
      }).addTo(map).bindPopup(`<b>🐠 இயற்கை மீன்பிடி பார்:</b><br>${reef.name}`);
    });

    let currentLat = 8.8238;
    let currentLng = 78.1567;
    let boatMarker = null;

    // நீங்கள் சுயமாக சேமிக்கும் பார்கள்
    function loadSavedReefs() {
      const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
      savedSpots.forEach((spot) => {
        L.marker([spot.lat, spot.lng])
          .addTo(map)
          .bindPopup(`<b>📍 உங்கள் பார்: ${spot.name}</b><br>Lat: ${spot.lat.toFixed(4)}<br>Lng: ${spot.lng.toFixed(4)}`);
      });
    }

    function saveReefLocation() {
      const spotName = prompt("பார் அல்லது இடத்தின் பெயர் உள்ளிடவும்:", "மீன் பார்");
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { name: spotName, lat: currentLat, lng: currentLng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        L.marker([currentLat, currentLng])
          .addTo(map)
          .bindPopup(`<b>📍 ${newSpot.name}</b><br>Lat: ${currentLat.toFixed(4)}<br>Lng: ${currentLng.toFixed(4)}`)
          .openPopup();

        alert("பார் இடம் சேமிக்கப்பட்டது!");
      }
    }

    // ஜிபிஎஸ் லைவ் ட்ராக்கிங்
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const speedKnots = pos.coords.speed ? (pos.coords.speed * 1.94384).toFixed(1) : "0.0";
          const heading = pos.coords.heading ? pos.coords.heading.toFixed(0) : "0";

          document.getElementById('speed').innerText = speedKnots + " kts";
          document.getElementById('heading').innerText = heading + "°";
          document.getElementById('coords').innerText = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;

          if (!boatMarker) {
            boatMarker = L.circleMarker([currentLat, currentLng], {
              radius: 9,
              color: '#00ffff',
              fillColor: '#0077ff',
              fillOpacity: 1
            }).addTo(map).bindPopup("உங்கள் படகு");
          } else {
            boatMarker.setLatLng([currentLat, currentLng]);
          }
        },
        (err) => console.log(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    loadSavedReefs();
  </script>
</body>
</html>

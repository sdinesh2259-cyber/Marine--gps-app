<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Marine GPS & Sonar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #000; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* மேல் மிதக்கும் தகவல் பலகை */
    .top-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(11, 19, 43, 0.9);
      backdrop-filter: blur(5px);
      border: 1px solid #3a506b;
      border-radius: 12px;
      padding: 10px 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .app-title { font-size: 15px; font-weight: bold; color: #48cae4; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #00b4d8; color: #000; font-weight: bold; }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }
    .data-card {
      background: rgba(28, 37, 65, 0.8);
      padding: 4px 2px;
      border-radius: 6px;
    }
    .data-label { font-size: 10px; color: #8d99ae; }
    .data-val { font-size: 12px; font-weight: bold; color: #00f0ff; margin-top: 2px; }

    /* கீழ் மிதக்கும் சோனார் பலகை */
    .bottom-overlay {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 10px;
      background: rgba(11, 19, 43, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 8px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sonar-title { font-size: 11px; color: #00f0ff; font-weight: bold; }
    #sonar-canvas { width: 100%; height: 50px; background: #051329; border-radius: 6px; }

    .btn-sonar {
      background: #00b4d8;
      color: #000;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-sonar:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <!-- வரைபடம் -->
  <div id="map"></div>

  <!-- மேல் பலகை -->
  <div class="top-overlay">
    <div class="header-row">
      <div class="app-title">🚤 DM Marine GPS</div>
      <div class="status-badge">GPS தயார்</div>
    </div>
    <div class="data-grid">
      <div class="data-card"><div class="data-label">வேகம்</div><div class="data-val" id="speed">0.0 kn</div></div>
      <div class="data-card"><div class="data-label">திசை</div><div class="data-val" id="heading">0°</div></div>
      <div class="data-card"><div class="data-label">அட்சரேகை</div><div class="data-val" id="lat">--</div></div>
      <div class="data-card"><div class="data-label">தீர்க்கரேகை</div><div class="data-val" id="lng">--</div></div>
    </div>
  </div>

  <!-- கீழ் பலகை -->
  <div class="bottom-overlay">
    <div class="sonar-title">ஆழம்: <span id="depth-val">--</span> M | தரை: <span id="surface-val">தேடுகிறது...</span></div>
    <canvas id="sonar-canvas"></canvas>
    <button class="btn-sonar" onclick="connectBluetoothSonar()">📡 சோனார் இணை (ESP32 Bluetooth)</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, boatMarker, boatCircle;
    let currentLat = 8.8038, currentLng = 78.1460;

    map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    const boatIcon = L.divIcon({
      className: 'boat-icon',
      html: '<div style="font-size:26px;">🚤</div>',
      iconSize: [30, 30], iconAnchor: [15, 15]
    });

    boatMarker = L.marker([currentLat, currentLng], { icon: boatIcon }).addTo(map);
    boatCircle = L.circle([currentLat, currentLng], { radius: 25, color: '#00f0ff' }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        const speedKnots = (pos.coords.speed ? pos.coords.speed * 1.94384 : 0).toFixed(1);
        const headingDeg = pos.coords.heading ? Math.round(pos.coords.heading) : 0;

        document.getElementById('lat').innerText = currentLat.toFixed(4);
        document.getElementById('lng').innerText = currentLng.toFixed(4);
        document.getElementById('speed').innerText = `${speedKnots} kn`;
        document.getElementById('heading').innerText = `${headingDeg}°`;

        const newPos = [currentLat, currentLng];
        boatMarker.setLatLng(newPos);
        boatCircle.setLatLng(newPos);
        map.panTo(newPos);
      }, err => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
    }

    async function connectBluetoothSonar() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ESP32' }, { namePrefix: 'Sonar' }],
          optionalServices: ['battery_service', 0xFFE0]
        });
        alert(`டிவைஸ் இணைக்கப்பட்டது: ${device.name}`);
        document.getElementById('surface-val').innerText = "பாறை / மணல்";
      } catch (err) {
        alert("ப்ளூடூத் கிடைக்கவில்லை அல்லது இணைக்கப்படவில்லை");
      }
    }

    const canvas = document.getElementById('sonar-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    function drawSonar() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const depth = (Math.sin(Date.now() / 1500) * 8 + 22).toFixed(1);
      document.getElementById('depth-val').innerText = depth;

      points.push(depth * 1.5);
      if (points.length > canvas.width / 5) points.shift();

      ctx.beginPath();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      for (let i = 0; i < points.length; i++) {
        const x = i * 5;
        const y = canvas.height - points[i];
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      requestAnimationFrame(drawSonar);
    }
    drawSonar();
  </script>
</body>
</html>

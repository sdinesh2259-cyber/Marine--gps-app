<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Depth & Reef GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 1000;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .val { font-size: 16px; font-weight: bold; color: #00ffcc; }
    .label { font-size: 11px; color: #ccc; }
    .btn-save {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div>
      <div class="label">வேகம் (SOG)</div>
      <div class="val" id="speed">0.0 kts</div>
    </div>
    <div>
      <div class="label">திசை (Heading)</div>
      <div class="val" id="heading">0°</div>
    </div>
    <div>
      <div class="label">தற்போதைய இடம்</div>
      <div class="val" id="coords" style="font-size: 11px; color: #fff;">0.0000, 0.0000</div>
    </div>
  </div>

  <button class="btn-save" onclick="saveReefLocation()">📍 பார் / மீன் spot சேவ் செய்</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // தொடக்கப் புள்ளி (தூத்துக்குடி / கடலோரப் பகுதி)
    const map = L.map('map').setView([8.8238, 78.1567], 11);

    // 1. கடல் மற்றும் தரைப்பகுதி வரைபடம் (Standard OpenStreetMap Base)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. OpenSeaMap (கடல் ஆழம், மிதவைகள், விளக்குகள் மற்றும் பாறை அடையாளங்கள்)
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenSeaMap'
    }).addTo(map);

    let currentLat = 8.8238;
    let currentLng = 78.1567;
    let boatMarker = null;

    // நீங்கள் சேமித்த பாறைகள் மற்றும் மீன்பிடி இடங்களை ஏற்றுதல்
    function loadSavedReefs() {
      const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
      savedSpots.forEach((spot) => {
        L.marker([spot.lat, spot.lng])
          .addTo(map)
          .bindPopup(`<b>🐠 ${spot.name}</b><br>Lat: ${spot.lat.toFixed(4)}<br>Lng: ${spot.lng.toFixed(4)}`);
      });
    }

    // புதிய இடத்தை சேமிக்க
    function saveReefLocation() {
      const spotName = prompt("இந்த இடத்தின் பெயர் (எ.கா: பாறை பார் / மீன் கூடும் இடம்):", "மீன் பார் " + new Date().toLocaleDateString());
      if (spotName) {
        const savedSpots = JSON.parse(localStorage.getItem('marineReefs') || '[]');
        const newSpot = { name: spotName, lat: currentLat, lng: currentLng };
        savedSpots.push(newSpot);
        localStorage.setItem('marineReefs', JSON.stringify(savedSpots));

        L.marker([currentLat, currentLng])
          .addTo(map)
          .bindPopup(`<b>🐠 ${newSpot.name}</b><br>Lat: ${currentLat.toFixed(4)}<br>Lng: ${currentLng.toFixed(4)}`)
          .openPopup();

        alert("இடம் வெற்றிகரமாக சேமிக்கப்பட்டது!");
      }
    }

    // ஜிபிஎஸ் லைவ் லொகேஷன்
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const speedKnots = pos.coords.speed ? (pos.coords.speed * 1.94384).toFixed(1) : "0.0";
          const heading = pos.coords.heading ? pos.coords.heading.toFixed(0) : "0";

          document.getElementById('speed').innerText = speedKnots + " kts";
          document.getElementById('heading').innerText = heading + "°";
          document.getElementById('coords').innerText = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;

          if (!boatMarker) {
            boatMarker = L.circleMarker([currentLat, currentLng], {
              radius: 9,
              color: '#ff0000',
              fillColor: '#0077ff',
              fillOpacity: 1
            }).addTo(map).bindPopup("உங்கள் படகு");
          } else {
            boatMarker.setLatLng([currentLat, currentLng]);
          }
        },
        (err) => console.log(err),
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    loadSavedReefs();
  </script>
</body>
</html>

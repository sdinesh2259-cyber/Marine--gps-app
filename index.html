<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Marin GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0b132b; color: #fff; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    .top-dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(11, 19, 43, 0.92);
      border: 1px solid #3a506b;
      border-radius: 12px;
      padding: 10px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .app-title { font-size: 15px; font-weight: bold; color: #48cae4; }
    .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #00b4d8; color: #000; font-weight: bold; }

    .grid-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }
    .card { background: rgba(28, 37, 65, 0.85); padding: 6px 2px; border-radius: 6px; }
    .card-label { font-size: 10px; color: #8d99ae; }
    .card-val { font-size: 12px; font-weight: bold; color: #00f0ff; margin-top: 2px; }

    .side-actions {
      position: absolute;
      right: 12px;
      top: 110px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }
    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1c2541;
      border: 2px solid #48cae4;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .btn-circle:active { transform: scale(0.92); }

    .bottom-bar {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 10px;
      background: rgba(11, 19, 43, 0.95);
      border: 1px solid #3a506b;
      border-radius: 12px;
      padding: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }
    .btn-primary {
      flex: 1;
      background: #00b4d8;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-dashboard">
    <div class="header-bar">
      <div class="app-title">🚤 DM Marin GPS</div>
      <div class="status-badge" id="gps-status">GPS தயார்</div>
    </div>
    <div class="grid-info">
      <div class="card"><div class="card-label">வேகம்</div><div class="card-val" id="speed">0.0 kn</div></div>
      <div class="card"><div class="card-label">திசை</div><div class="card-val" id="heading">0°</div></div>
      <div class="card"><div class="card-label">அட்சரேகை</div><div class="card-val" id="lat">--</div></div>
      <div class="card"><div class="card-label">தீர்க்கரேகை</div><div class="card-val" id="lng">--</div></div>
    </div>
  </div>

  <div class="side-actions">
    <div class="btn-circle" onclick="centerBoat()" title="படகின் இடம்">🎯</div>
    <div class="btn-circle" onclick="toggleMapLayer()" title="மேப் மாற்று">🗺️</div>
    <div class="btn-circle" onclick="saveCurrentWaypoint()" title="புள்ளி சேமிக்க">📍</div>
  </div>

  <div class="bottom-bar">
    <button class="btn-primary" onclick="saveCurrentWaypoint()">📍 தற்போதைய இடத்தை சேமி (Waypoint)</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, boatMarker, boatCircle;
    let currentLat = 8.8038, currentLng = 78.1460;
    let trackCoordinates = [];
    let trackLine = null;

    // மேப் லேயர்கள்
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 });
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });

    map = L.map('map', { zoomControl: false, layers: [osmLayer] }).setView([currentLat, currentLng], 14);

    let isSatellite = false;
    function toggleMapLayer() {
      if (isSatellite) {
        map.removeLayer(satLayer);
        map.addLayer(osmLayer);
        isSatellite = false;
      } else {
        map.removeLayer(osmLayer);
        map.addLayer(satLayer);
        isSatellite = true;
      }
    }

    const boatIcon = L.divIcon({
      className: 'boat-icon',
      html: '<div style="font-size:26px;">🚤</div>',
      iconSize: [30, 30], iconAnchor: [15, 15]
    });

    boatMarker = L.marker([currentLat, currentLng], { icon: boatIcon }).addTo(map);
    boatCircle = L.circle([currentLat, currentLng], { radius: 20, color: '#00f0ff' }).addTo(map);

    trackLine = L.polyline([], { color: '#00f0ff', weight: 3 }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        const speedKnots = (pos.coords.speed ? pos.coords.speed * 1.94384 : 0).toFixed(1);
        const headingDeg = pos.coords.heading ? Math.round(pos.coords.heading) : 0;

        document.getElementById('lat').innerText = currentLat.toFixed(4);
        document.getElementById('lng').innerText = currentLng.toFixed(4);
        document.getElementById('speed').innerText = `${speedKnots} kn`;
        document.getElementById('heading').innerText = `${headingDeg}°`;

        const newPos = [currentLat, currentLng];
        boatMarker.setLatLng(newPos);
        boatCircle.setLatLng(newPos);

        trackCoordinates.push(newPos);
        trackLine.setLatLngs(trackCoordinates);
      }, err => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
    }

    function centerBoat() {
      map.panTo([currentLat, currentLng]);
    }

    function saveCurrentWaypoint() {
      const name = prompt("சேமிக்க வேண்டிய இடத்தின் பெயர் (எ.கா: பாறை 1 / வலை போட்ட இடம்):");
      if (name) {
        L.marker([currentLat, currentLng])
          .addTo(map)
          .bindPopup(`<b>${name}</b><br>GPS: ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`)
          .openPopup();
      }
    }
  </script>
</body>
</html>
